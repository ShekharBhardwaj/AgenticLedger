<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/app/assets/raccoon.svg" />
    <!-- Safari and phone home screens do not use SVG icons: a PNG for them. -->
    <link rel="icon" type="image/png" sizes="256x256" href="/app/assets/raccoon-256.png" />
    <link rel="apple-touch-icon" href="/app/assets/raccoon-256.png" />
    <title>AgenticLedger</title>
    <script>
      // Resolve the appearance preference before first paint so the page
      // never flashes the wrong theme. Dark is the default experience;
      // "system" follows the OS.
      (function () {
        try {
          var pref = localStorage.getItem("agenticledger.ui.theme") || "dark";
          var dark = pref === "dark" ||
            (pref === "system" &&
             window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
