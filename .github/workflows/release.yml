name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Gate: tests must pass before anything is published ───────────────────────
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  # ── Docker → GHCR (+ Docker Hub mirror), multi-arch, signed, with SBOM ───────
  docker:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing (Sigstore OIDC)
    env:
      # The Docker Hub mirror activates automatically once the
      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets exist.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build web app
        run: |
          cd dashboard-app
          npm ci
          npm run build

      - name: Build wheel
        run: |
          pip install hatchling hatch-vcs build
          python -m build --wheel

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image names
        id: images
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "ghcr=ghcr.io/${OWNER}/agentic-ledger" >> "$GITHUB_OUTPUT"
          {
            echo 'list<<IMAGES'
            echo "ghcr.io/${OWNER}/agentic-ledger"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/${DOCKERHUB_USERNAME}/agentic-ledger"
            fi
            echo 'IMAGES'
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (linux/amd64 + linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images (Sigstore keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGES: ${{ steps.images.outputs.list }}
        run: |
          for image in $IMAGES; do
            cosign sign --yes "${image}@${DIGEST}"
          done

      - name: Generate image SBOM (SPDX) for the release
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.images.outputs.ghcr }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-agenticledger-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-agenticledger-image.spdx.json

  # ── PyPI ─────────────────────────────────────────────────────────────────────
  pypi:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build web app
        run: |
          cd dashboard-app
          npm ci
          npm run build

      - name: Install build tools
        run: pip install hatchling hatch-vcs build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ── GitHub Release ────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker, pypi]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download image SBOM
        uses: actions/download-artifact@v7
        with:
          name: sbom

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: sbom-agenticledger-image.spdx.json

