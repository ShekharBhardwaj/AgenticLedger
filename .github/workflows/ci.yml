name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff (lint)
        run: ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check syntax (all modules)
        run: python -m compileall agentledger/

      - name: Run tests with coverage
        env:
          AGENTLEDGER_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/agentledger_test
        run: pytest --cov=agentledger --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # A tester's first contact, exercised on every push: build the wheel the way
  # the release does, install it with --pre into a clean venv (which loosens
  # dependency resolution — this is what let httpx 1.0.dev3 in before
  # v0.3.0-alpha.2), boot the proxy, and check /health and the web app.
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build web app
        run: |
          cd dashboard-app
          npm ci
          npm run build

      - name: Build wheel
        run: |
          pip install hatchling hatch-vcs build
          python -m build --wheel

      - name: Install with --pre into a clean venv and smoke test
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --pre dist/*.whl
          cd /tmp
          AGENTLEDGER_UPSTREAM_URL=https://api.anthropic.com /tmp/fresh/bin/python -m agentledger.proxy &
          sleep 4
          curl -sf http://localhost:8000/health
          curl -sf -o /dev/null http://localhost:8000/app
          echo "fresh install boots, /health and /app respond"

  # The Dockerfile must build from a plain checkout with nothing in dist/ —
  # the PyPI-fallback path that Glama and anyone running a cold `docker build`
  # exercises. The release pipeline covers the wheel-in-dist/ path.
  docker-cold-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (PyPI fallback, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
