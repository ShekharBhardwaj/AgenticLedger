[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "agentic-ledger"
dynamic = ["version"]
description = "Runtime observability for AI agents — see exactly what your agent did, why it did it, and what it cost."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Shekhar Bhardwaj" }
]
keywords = [
    "ai", "agents", "llm", "observability", "debugging", "tracing",
    "openai", "anthropic", "langchain", "crewai", "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # <1.0.dev0 (not <1.0) so `pip install --pre` can't resolve httpx's 1.0
    # dev builds, which drop AsyncClient. PEP 440 orders 1.0.devN before 1.0,
    # so a plain <1.0 cap would still admit them under --pre.
    "httpx>=0.27,<1.0.dev0",
    "aiosqlite>=0.19",
    # tomllib is stdlib from 3.11; 3.10 needs the reference implementation
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
agenticledger = "agenticledger.cli:main"

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29",
]
otel = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "openai>=1.0",
    "anthropic>=0.18",
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "hatch-vcs",
    # exercises the http/protobuf OTLP ingest path in tests
    "opentelemetry-proto>=1.24",
]

[project.urls]
Homepage   = "https://agentic-ledger.dev"
Repository = "https://github.com/ShekharBhardwaj/AgenticLedger"
Issues     = "https://github.com/ShekharBhardwaj/AgenticLedger/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["agenticledger"]
# artifacts force-includes VCS-ignored files: the mascot and the built SPA
# (dashboard-app/ -> vite build -> agenticledger/proxy/static/). Release CI runs
# the npm build before python -m build; a source install without the assets
# still works — /app falls back with a clear message.
artifacts = [
    "agenticledger/proxy/mascot.jpg",
    "agenticledger/proxy/static/",
]

[tool.hatch.build.targets.sdist]
include = [
    "/agenticledger",
    "/README.md",
    "/LICENSE",
]
artifacts = [
    "agenticledger/proxy/static/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["agenticledger"]
omit = ["agenticledger/proxy/dashboard.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Curated set: real-bug rules (pyflakes/bugbear) + import hygiene + simple cleanups.
# E501 (line length) is left to judgment — the dashboard/report modules embed long
# HTML/format strings. The Optional[X] -> X | None rewrites (UP045/UP007) are skipped
# to avoid churning the codebase's existing typing style.
select = ["E", "F", "W", "I", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests favor readability over import-at-top and may shadow builtins in fixtures.
"tests/*" = ["E402", "B008"]
