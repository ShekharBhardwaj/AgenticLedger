services:

  # SQLite — zero setup, good for a single machine
  # The container runs as non-root (uid 10001). On Linux hosts, give it the
  # bind-mounted data dir first: mkdir -p data && sudo chown 10001 data
  # (Docker Desktop on macOS/Windows handles this automatically.)
  agenticledger:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - AGENTICLEDGER_UPSTREAM_URL=${AGENTICLEDGER_UPSTREAM_URL:-https://api.openai.com}
      - AGENTICLEDGER_DSN=sqlite:////data/agenticledger.db
      - AGENTICLEDGER_API_KEY=${AGENTICLEDGER_API_KEY:-}
      - AGENTICLEDGER_BUDGET_SESSION=${AGENTICLEDGER_BUDGET_SESSION:-}
      - AGENTICLEDGER_BUDGET_AGENT=${AGENTICLEDGER_BUDGET_AGENT:-}
      - AGENTICLEDGER_BUDGET_DAILY=${AGENTICLEDGER_BUDGET_DAILY:-}
      - AGENTICLEDGER_BUDGET_USER=${AGENTICLEDGER_BUDGET_USER:-}

